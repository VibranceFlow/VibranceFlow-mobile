name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and protocol v1 guard
        run: |
          npm run typecheck
          npm run verify:protocol

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Verify ws:// cleartext in Android manifest
        run: node scripts/verify-android-cleartext.js

      - name: Build release APKs (ABI splits + universal)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Package branded APKs and SHA-256 sidecars
        run: bash scripts/package-release-apks.sh

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VibranceFlow-mobile-android-apks
          path: |
            dist/android-apk/*.apk
            dist/android-apk/*.sha256
          if-no-files-found: error
